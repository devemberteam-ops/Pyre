# Pyre — multi-platform release build.
#
# Builds Android (APK), Windows, Linux, and Web in parallel, then attaches
# everything to a DRAFT GitHub Release. The headline value is the **Linux**
# and **Web** artifacts — you can't produce those on a Windows dev box, so CI
# is the only way the README's platform table actually ships.
#
# HOW TO CUT A RELEASE:
#   git tag v1.0.0
#   git push origin v1.0.0
# …or run it manually from the Actions tab (workflow_dispatch) to smoke-test
# the builds without tagging (the release step is skipped unless it's a tag).
#
# The release is created as a DRAFT so you review + publish by hand.
#
# NOTE on Android signing: this builds a release APK that is DEBUG-SIGNED
# unless you wire your keystore in as GitHub Secrets (KEYSTORE_BASE64,
# STORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS) and decode it into
# android/key.properties in the android job. Your locally-signed APK (per
# docs/RELEASE.md) stays the canonical install; the CI APK is fine for
# quick testing / web+linux+windows are unaffected.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Optional: produce a properly-signed release APK when the keystore
      # secrets are set. Without them, Gradle falls back to debug signing
      # (see android/app/build.gradle.kts), so the build still succeeds.
      - name: Configure release signing
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: pyre-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      # Bundle the web client INTO the desktop build so the LAN server can
      # self-host the browser UI. pyre_server.dart looks for `web/` next to
      # the exe; without it the server returns "Route Not Found" at the root
      # URL and the whole "open it in a browser over LAN" flow is dead.
      - name: Build + bundle web UI next to the exe
        run: |
          flutter build web --release
          Copy-Item -Path build/web -Destination build/windows/x64/runner/Release/web -Recurse
      # Zip the WHOLE Release folder — the .exe needs its sibling DLLs +
      # data/ + web/ to run; shipping the bare exe is broken.
      - name: Zip Windows bundle
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath pyre-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: pyre-windows
          path: pyre-windows-x64.zip
          if-no-files-found: error

  linux:
    name: Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # System libs required by the desktop plugins (per linux/flutter/generated_plugins.cmake):
      #   libsecret-1-dev + libjsoncpp-dev      -> flutter_secure_storage_linux (API keys in the OS keyring)
      #   libnotify-dev                          -> local_notifier (completion toasts)
      #   libayatana-appindicator3-dev           -> tray_manager (system tray icon)
      # Without them the CMake configure step fails before the build even starts.
      - name: Install Linux desktop build deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev libjsoncpp-dev libnotify-dev libayatana-appindicator3-dev patchelf
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release
      # issue #3 (Fedora 43): `./pyre: error while loading shared libraries:
      # libayatana-appindicator3.so.1`. The tray_manager plugin links the
      # ayatana appindicator stack at build time (libayatana-appindicator3-dev
      # above), but Flutter's bundle never ships the runtime .so — so the plain
      # tarball dies on any distro that doesn't already have it (Fedora, Arch,
      # older Ubuntu…). Copy the appindicator/dbusmenu closure the built
      # binary + bundled plugin libs actually reference into bundle/lib/;
      # Flutter's RPATH is $ORIGIN/lib, so they resolve right next to `pyre`.
      # Fully defensive (set +e / exit 0): this step can NEVER fail the build —
      # worst case it copies nothing and the tarball is exactly as it was.
      - name: Bundle appindicator runtime libs into the tarball (issue #3)
        run: |
          set +e
          libdir=build/linux/x64/release/bundle/lib
          mkdir -p "$libdir"
          # appindicator/libsecret are dependencies of PLUGIN .so's, not of
          # `pyre` directly — so walk the binary AND every bundled plugin lib.
          ldd "build/linux/x64/release/bundle/pyre" "$libdir"/*.so 2>/dev/null \
            | grep -iE 'ayatana|dbusmenu|appindicator|libsecret' \
            | awk '{print $3}' | sort -u | grep -v '^$' \
            | while read -r so; do [ -f "$so" ] && cp -vL "$so" "$libdir/"; done
          echo "--- extra runtime libs now shipped in the tarball ---"
          ls -1 "$libdir" | grep -iE 'ayatana|dbusmenu|appindicator|libsecret' \
            || echo "(none matched — tarball unchanged from before)"
          # v1.2.1 smoke-gate finding (verified in a local clean-container
          # repro): Flutter's plugin .so's ship a DEAD build-tree RUNPATH
          # (/home/runner/.../ephemeral), so the loader never looks in the
          # bundle's own lib/ for the plugins' dependencies — the copied
          # libs were shipped but UNRESOLVABLE, and startup still died on
          # clean distros. Point every bundled lib at its own directory.
          for so in "$libdir"/*.so*; do
            patchelf --set-rpath '$ORIGIN' "$so" 2>/dev/null
          done
          echo "--- plugin RUNPATHs repointed at \$ORIGIN ---"
          exit 0
      # Bundle the web client INTO the desktop build so the LAN server can
      # self-host the browser UI (pyre_server.dart looks for `web/` next to
      # the `pyre` binary). Without it the LAN server 404s at the root URL.
      - name: Build + bundle web UI next to the binary
        run: |
          flutter build web --release
          cp -r build/web build/linux/x64/release/bundle/web
      - name: Tarball Linux bundle
        run: tar -czf pyre-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      # AppImage (1.2.1, community ask): one downloadable file with desktop
      # entry + icon baked in — no manual chmod/.desktop crafting. The bundle
      # is already self-contained (libs + $ORIGIN rpaths above), so the
      # AppImage is a thin wrapper: AppRun execs usr/bin/pyre, which finds its
      # lib/ data/ web/ siblings exactly as in the tarball. Recipe validated
      # end-to-end locally (WSL build + real boot) before landing here.
      - name: Build AppImage
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p appdir/usr/bin
          cp -r build/linux/x64/release/bundle/. appdir/usr/bin/
          cp appdir/usr/bin/web/icons/Icon-512.png appdir/pyre.png
          printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=Pyre' \
            'Comment=BYOK AI roleplay chat — SillyTavern-compatible' \
            'Exec=pyre' 'Icon=pyre' 'Terminal=false' \
            'Categories=Network;Chat;' 'StartupWMClass=app.pyre.pyre' \
            > appdir/pyre.desktop
          printf '%s\n' '#!/bin/sh' \
            'HERE="$(dirname "$(readlink -f "$0")")"' \
            'exec "$HERE/usr/bin/pyre" "$@"' > appdir/AppRun
          chmod +x appdir/AppRun appdir/usr/bin/pyre
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 \
            ./appimagetool-x86_64.AppImage appdir "Pyre-${VERSION}-x86_64.AppImage"
          ls -lh Pyre-*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: pyre-linux
          path: |
            pyre-linux-x64.tar.gz
            Pyre-*.AppImage
          if-no-files-found: error

  # Environment smoke (Tier 2, 1.2.1): boot-check the SHIPPED Linux tarball in
  # a CLEAN container. The libayatana bug (issue #3) was invisible because the
  # build runner has every build dep installed — "works where it was built" told
  # us nothing about a user's machine. This job extracts the actual artifact
  # into a bare Fedora with only the standard desktop baseline (GTK3 — what any
  # desktop distro ships) and fails on ANY unresolved shared library.
  # Deliberately NOT in the release job's `needs`: a red X here is a loud
  # signal, but it can't brick the release pipeline while the job is young.
  linux-clean-smoke:
    name: Linux tarball smoke (clean container)
    needs: [linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pyre-linux
      - name: Extract tarball
        run: mkdir -p bundle && tar -xzf pyre-linux-x64.tar.gz -C bundle
      - name: ldd gate in bare Fedora (+GTK3 baseline only)
        run: |
          docker run --rm -v "$PWD/bundle:/app:ro" fedora:latest bash -c '
            set -e
            dnf install -y -q gtk3 glibc >/dev/null
            echo "--- unresolved libs in the shipped bundle (must be empty) ---"
            # Scan ONLY the executable: ldd on /app/pyre resolves the FULL
            # recursive chain with real loader rules — exactly what happens
            # at startup (the user-reported failure mode). Scanning each
            # lib/*.so in isolation produced false positives (libflutter,
            # libjvm) for libs that resolve fine inside the real process.
            missing=$(ldd /app/pyre 2>/dev/null | grep "not found" | sort -u || true)
            if [ -n "$missing" ]; then
              echo "$missing"
              echo "FAIL: the tarball does not run on a clean desktop distro."
              exit 1
            fi
            echo "(none — bundle is self-contained against a GTK3 baseline)"
          '

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release
      - name: Zip web build
        run: cd build/web && zip -r ../../pyre-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: pyre-web
          path: pyre-web.zip
          if-no-files-found: error

  release:
    name: Draft GitHub Release
    needs: [android, windows, linux, web]
    runs-on: ubuntu-latest
    # Only publish a Release for an actual tag push — workflow_dispatch runs
    # just build + upload the per-platform artifacts (a smoke test).
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten + checksum
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.apk' -o -name '*.zip' -o -name '*.tar.gz' -o -name '*.AppImage' \) -exec cp {} dist/ \;
          mv dist/app-release.apk dist/pyre-android.apk 2>/dev/null || true
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
